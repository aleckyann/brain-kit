name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The suite runs on the oldest Node the kit supports (22, the floor in
  # package.json and src/node-guard.mjs) and on the one it recommends (24 LTS).
  # setup-node puts the matrix Node first on PATH, so `npm test` (`node --test`)
  # runs on it. test/node-minimum.test.mjs keeps the lowest entry of this axis equal
  # to the floor and requires the recommended Node to be in it too.
  test:
    name: node --test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (includes zero-dependency and generic no-leak gates)
        run: npm test
      - name: Package contents
        run: npm pack --dry-run

  # Windows (docs/incidents.md, 05/10/2026): the tests of the first run on
  # Windows, those that need Windows itself included: the real lookup of node
  # and git with PATHEXT, a real ACL set and read by SID, and a real Task
  # Scheduler task registered, read back and removed. Elsewhere they reach
  # the Windows branch through each function's platform seam.
  windows:
    name: Windows tests (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Tests of the first run on Windows
        run: node --test test/incidents/2026-10-05-windows-first-run.test.mjs

  plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
